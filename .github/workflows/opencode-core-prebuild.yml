name: opencode-core-prebuild

on:
  push:
    branches:
      - dev
    paths:
      - "packages/opencode-core/**"
      - ".github/workflows/opencode-core-prebuild.yml"
  pull_request:
    paths:
      - "packages/opencode-core/**"
      - ".github/workflows/opencode-core-prebuild.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-unknown-linux-musl
            name: linux-x64
          - host: blacksmith-8vcpu-ubuntu-2404-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
          - host: macos-latest
            target: x86_64-apple-darwin
            name: darwin-x64
          - host: macos-latest
            target: aarch64-apple-darwin
            name: darwin-arm64
          - host: blacksmith-4vcpu-windows-2025
            target: x86_64-pc-windows-msvc
            name: win32-x64
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Build prebuild
        working-directory: packages/opencode-core
        env:
          RUST_BACKTRACE: "1"
        run: bunx --bun @napi-rs/cli@latest build --release --platform --target ${{ matrix.settings.target }}

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-core-${{ matrix.settings.name }}
          path: packages/opencode-core/prebuilds
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all prebuild artifacts
        uses: actions/download-artifact@v4
        with:
          path: prebuilds
          pattern: opencode-core-*
          merge-multiple: true

      - name: Verify required platform binaries exist
        run: |
          set -euo pipefail
          required=(
            "linux-x64/opencode-core.node"
            "linux-arm64/opencode-core.node"
            "darwin-x64/opencode-core.node"
            "darwin-arm64/opencode-core.node"
            "win32-x64/opencode-core.node"
          )
          for item in "${required[@]}"; do
            if [ ! -f "prebuilds/$item" ]; then
              echo "Missing prebuild: $item"
              exit 1
            fi
          done
          echo "All required prebuilds found."

      - name: Upload merged prebuild bundle
        uses: actions/upload-artifact@v4
        with:
          name: opencode-core-prebuilds-all
          path: prebuilds
          if-no-files-found: error
